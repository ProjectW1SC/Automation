<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
<defs>
 <filter id="smoke" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency=".007 .014" numOctaves="5" seed="11" result="wave"/>
  <feColorMatrix in="wave" type="matrix" values="2.2 0 0 0 -.65 2.2 0 0 0 -.65 2.2 0 0 0 -.65 0 0 0 1 0" result="gray"/>
  <feGaussianBlur in="gray" stdDeviation="3" result="soft"/>
  <feComponentTransfer in="soft"><feFuncR type="gamma" amplitude="1.0" exponent="2.3" offset="0"/><feFuncG type="gamma" amplitude="1.0" exponent="2.3" offset="0"/><feFuncB type="gamma" amplitude="1.0" exponent="2.3" offset="0"/></feComponentTransfer>
 </filter>
 <radialGradient id="shade"><stop stop-color="#ffffff" stop-opacity=".38"/><stop offset=".65" stop-color="#0b0b0b" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".48"/></radialGradient>
</defs>
<rect width="900" height="700" fill="#0b0b0b"/>
<rect width="900" height="700" filter="url(#smoke)" opacity=".92"/>
<rect width="900" height="700" fill="url(#shade)"/>
</svg>